version: 1
formatters:
  simple:
    format: "%(asctime)s-%(levelname)s :: %(name)s :: [%(message)s]"
handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout
loggers:
  app:
    level: DEBUG
    handlers: [console]
    propagate: no
root:
  level: DEBUG
  handlers: [console]
  propagate: no
