version: 1
formatters:
  simple:
    format: "%(name)-16s :: %(levelname)-8s :: %(asctime)-25s :: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout
loggers:
  app:
    level: DEBUG
    handlers: [console]
    propagate: no
  models:
    level: DEBUG
    handlers: [console]
    propagate: no
  mpd_connector:
    level: DEBUG
    handlers: [console]
    propagate: no
root:
  level: DEBUG
  handlers: [console]
  propagate: no
