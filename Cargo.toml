[package]
name = "ksol"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
cxx = "1.0.144"
cxx-qt = "0.8.0"
cxx-qt-lib = { version = "0.8.0", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
which = "8.0.0"
xdg = "3.0.0"
num-traits = "0.2"
num-derive = "0.4"
tokio = { version = "1.48.0", features = ["time", "sync", "process", "rt-multi-thread", "fs"] }
mpd_client = { git = "https://github.com/skorodenko/mpd_client", branch = "refactoring" }
regex = "1.11.2"
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
serde_json = "1.0.143"
tinytemplate = "1.2.1"
toml = "0.9.8"
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tokio-util = "0.7.17"
mpris-server = "0.9.0"
bytes = "1.11.0"
tower = "0.5.2"
futures = "0.3.31"
image = "0.25.9"
turbojpeg = { version = "1.3.3", features = ["image"] }
anyhow = "1.0.100"

[build-dependencies]
cxx-qt-build = { version = "0.8.0", features = [ "link_qt_object_files" ] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
